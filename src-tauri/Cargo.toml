[package]
name = "vocalyx"
version = "0.1.0"
description = "VocaLyx Desktop Music Manager"
authors = ["TuneBox"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "vocalyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lofty = "0.25.1"
base64 = "0.23.1"
tauri-plugin-opener = "2.5.5"

# Sinkron headset / tombol media OS (Windows SMTC). Hanya di Windows agar
# build platform lain tidak ikut menarik dependensi WinRT.
[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"
raw-window-handle = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
