[package]
name = "vocalyx"
version = "0.1.0-beta"
description = "VocaLyx Desktop Music Manager"
authors = ["Arif Mundhofir"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "vocalyx_lib"
# Hanya rlib. staticlib/cdylib dipakai Tauri untuk target mobile (Android/iOS);
# VocaLyx ini Windows-only (tauri.conf.json bundle targets msi+nsis, tanpa
# config mobile), jadi keduanya cuma menghasilkan vocalyx_lib.dll + .exp +
# .lib yang tidak pernah dipakai runtime maupun installer. Dengan rlib saja,
# output itu tidak pernah terbentuk sama sekali - lebih baik dicegah daripada
# dihapus sesudah build.
crate-type = ["rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lofty = "0.25.1"
base64 = "0.23.1"
tauri-plugin-opener = "2.5.5"
# Runtime portable untuk installer Lite (Fase 3b): unduh runtime-cpu-<ver>.zip
# dari vocalyx-releases, verifikasi sha256, lalu ekstrak ke %APPDATA%\VocaLyx\runtime.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Sinkron headset / tombol media OS (Windows SMTC). Hanya di Windows agar
# build platform lain tidak ikut menarik dependensi WinRT.
[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"
raw-window-handle = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

# Hardening binary rilis. Tanpa section ini, Cargo memakai default yang menyisakan
# nama fungsi/variabel dan debug info di dalam exe, sehingga Ghidra/IDA langsung
# menampilkan `vocalyx_lib::engine::start` alih-alih `FUN_0000012345` dan analisis
# jauh lebih murah.
[profile.release]
# Buang simbol + debug info. Ini satu-satunya baris yang benar-benar menutup
# "peta nama fungsi" dari binary.
strip = "symbols"
# LTO fat + satu codegen unit: seluruh crate di-inline silang, struktur modul
# hilang dari binary.
lto = "fat"
codegen-units = 1
# "z" (ukuran) alih-alih "s" (kecepatan) - frontend JS sudah dipaket terpisah,
# jadi ukuran exe lebih penting daripada biaya startup.
opt-level = "z"
debug = false
debug-assertions = false
overflow-checks = false
incremental = false
# panic sengaja TIDAK disetel ke "abort". Tiga call site memakai spawn_blocking
# (runtime.rs::spawn_ensure_and_start, engine.rs::gpu::detect_cached, dan
# gpu::record_active), dan startup engine adalah tempat paling mungkin panic.
# Dengan abort, satu panic akan membunuh seluruh aplikasi, bukan jadi JoinError
# yang bisa ditangani. engine.rs juga masih menangai mutex poisoning, jadi
# semantik unwinding memang diharapkan di sini.
