[package]
name = "vocalyx"
version = "0.1.0-beta"
description = "VocaLyx Desktop Music Manager"
authors = ["Arif Mundhofir"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[lib]
name = "vocalyx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
lofty = "0.25.1"
base64 = "0.23.1"
tauri-plugin-opener = "2.5.5"
# Runtime portable untuk installer Lite (Fase 3b): unduh runtime-cpu-<ver>.zip
# dari vocalyx-releases, verifikasi sha256, lalu ekstrak ke %APPDATA%\VocaLyx\runtime.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Sinkron headset / tombol media OS (Windows SMTC). Hanya di Windows agar
# build platform lain tidak ikut menarik dependensi WinRT.
[target.'cfg(windows)'.dependencies]
souvlaki = "0.8"
raw-window-handle = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
